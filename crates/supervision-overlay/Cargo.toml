[package]
name = "supervision-overlay"
version = "0.1.0"
edition = "2021"
authors = ["Supervision Team <supervision@local>"]
description = "Layered restriction overlay for Supervision Desktop."
license = "MIT OR Apache-2.0"

[[bin]]
name = "supervision-overlay"
path = "src/main.rs"

[dependencies]
supervision-core = { path = "../supervision-core" }
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }
