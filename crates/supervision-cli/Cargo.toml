[package]
name = "supervision-cli"
version = "0.1.0"
edition = "2021"
authors = ["Supervision Team <supervision@local>"]
description = "Administrative CLI for Supervision Desktop: service management, rule inspection, and diagnostics."
license = "MIT OR Apache-2.0"

[[bin]]
name = "supervision-cli"
path = "src/main.rs"

[dependencies]
supervision-core = { path = "../supervision-core" }
tokio = { version = "1.38", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
