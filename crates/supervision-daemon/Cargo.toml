[package]
name = "supervision-daemon"
version = "0.1.0"
edition = "2021"
authors = ["Supervision Team <supervision@local>"]
description = "Privileged background daemon for Supervision Desktop: DNS proxy, process monitor, anti-tamper."
license = "MIT OR Apache-2.0"

[[bin]]
name = "supervision-daemon"
path = "src/main.rs"

[dependencies]
supervision-core = { path = "../supervision-core" }
tokio = { version = "1.38", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Services",
    "Win32_UI_WindowsAndMessaging",
] }
