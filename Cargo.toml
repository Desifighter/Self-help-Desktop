[workspace]
members = [
    "crates/supervision-core",
    "crates/supervision-daemon",
    "crates/supervision-cli",
    "crates/supervision-overlay",
    "crates/supervision-desktop/src-tauri",
]
resolver = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
